<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | Swarnaveda Luxury Jewellery</title>
  <meta name="description" content="View your saved favourite gold rings, necklaces, and bangles on Swarnaveda.">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/products.css">
  <style>
    .wishlist-container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: var(--space-8) var(--space-6) var(--space-16);
    }
    .wishlist-header {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: var(--space-4);
      margin-bottom: var(--space-8);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .wishlist-title {
      font-family: var(--font-serif);
      font-size: 2.25rem;
      font-weight: 500;
      color: var(--charcoal);
    }
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-6);
    }
    .empty-wishlist {
      text-align: center;
      padding: var(--space-16) var(--space-4);
      background: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px dashed var(--border-subtle);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <div id="shared-header"></div>

  <div class="wishlist-container">
    <div class="wishlist-header">
      <h1 class="wishlist-title">My Wishlist</h1>
      <span style="font-size: var(--text-sm); color: var(--text-muted);" id="wishlist-count-label">0 Items Saved</span>
    </div>

    <div class="wishlist-grid" id="wishlist-grid">
      <!-- Dynamically filled -->
    </div>
  </div>

  <div id="shared-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      renderSharedHeader();
      renderSharedFooter();
      renderWishlist();
    });

    function renderWishlist() {
      const wishlistIds = JSON.parse(localStorage.getItem('swarnaveda_wishlist') || '[]');
      const grid = document.getElementById('wishlist-grid');
      const countLabel = document.getElementById('wishlist-count-label');

      countLabel.textContent = `${wishlistIds.length} ${wishlistIds.length === 1 ? 'Item' : 'Items'} Saved`;

      if (wishlistIds.length === 0) {
        grid.innerHTML = `
          <div class="empty-wishlist">
            <div style="font-size: 3rem; margin-bottom: var(--space-3);">💖</div>
            <h3 style="font-family: var(--font-serif); font-size: 1.75rem; margin-bottom: var(--space-2);">Your Wishlist is Empty</h3>
            <p style="color: var(--text-muted); font-size: var(--text-sm); max-width: 420px; margin: 0 auto var(--space-6);">
              Explore our hallmarked bridal and fine gold collections and tap the heart icon to save designs you adore.
            </p>
            <a href="category.html?cat=gold-rings" class="btn btn-primary">Discover Jewellery</a>
          </div>
        `;
        return;
      }

      const items = (window.products || []).filter(p => wishlistIds.includes(p.id));

      grid.innerHTML = items.map(prod => `
        <div class="product-card" id="wishlist-item-${prod.id}">
          <div class="product-card-media">
            <div class="product-badges">
              <span class="badge badge-gold">${prod.goldPurity || '22K'}</span>
              <span class="badge badge-hallmark">BIS</span>
            </div>
            <a href="product.html?id=${prod.id}">
              <img src="${prod.image || '../assets/images/ring.jpg'}" alt="${prod.name}" class="product-card-img">
            </a>
            <button class="wishlist-btn active" onclick="removeFromWishlist('${prod.id}')" title="Remove from wishlist" style="color: var(--crimson);">
              ♥
            </button>
          </div>
          <div class="product-card-body">
            <div class="product-vendor">${prod.vendorName}</div>
            <a href="product.html?id=${prod.id}" class="product-title">${prod.name}</a>
            <div class="product-pricing">
              <span class="product-price">₹${prod.price.toLocaleString('en-IN')}</span>
              ${prod.compareAtPrice ? `<span class="product-original-price">₹${prod.compareAtPrice.toLocaleString('en-IN')}</span>` : ''}
            </div>
            <div style="display: flex; gap: var(--space-2); margin-top: var(--space-3);">
              <button class="btn btn-primary btn-sm" style="flex: 1;" onclick="moveToCart('${prod.id}')">
                Move to Cart
              </button>
              <button class="btn btn-secondary btn-sm" onclick="removeFromWishlist('${prod.id}')">
                Remove
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function removeFromWishlist(id) {
      window.toggleWishlist(id);
      renderWishlist();
    }

    function moveToCart(id) {
      window.addToCart(id, 1, 12);
      removeFromWishlist(id);
    }
  </script>
</body>
</html>
