<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Products Catalog | Swarnaveda Merchant Central</title>
  <meta name="description" content="Manage your listed jewellery designs, stock counts, and gold specifications.">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/vendor.css">
  <style>
    .product-thumb-sm {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--surface-warm);
    }
  </style>
</head>
<body>
  <div class="vendor-layout">
    <!-- Sidebar -->
    <aside class="vendor-sidebar">
      <div class="sidebar-logo">
        <a href="../index.html" style="text-decoration: none;">
          <div class="logo-wordmark">Swarna<span>veda</span></div>
          <div class="logo-tagline">Merchant Central</div>
        </a>
      </div>

      <div class="sidebar-vendor-info">
        <div class="vendor-avatar">R</div>
        <div>
          <div class="vendor-name">Raj Jewellers</div>
          <div class="vendor-status">BIS Certified Vendor</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-section">
          <div class="sidebar-nav-label">Core Management</div>
          <a href="dashboard.html" class="sidebar-nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
            <span>Dashboard</span>
          </a>
          <a href="products.html" class="sidebar-nav-link active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
            <span>My Products</span>
          </a>
          <a href="add-product.html" class="sidebar-nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
            <span>Add New Jewellery</span>
          </a>
        </div>

        <div class="sidebar-nav-section" style="margin-top: var(--space-4);">
          <div class="sidebar-nav-label">Marketplace</div>
          <a href="../index.html" class="sidebar-nav-link" target="_blank">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span>View Marketplace</span>
          </a>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="vendor-main">
      <header class="vendor-header">
        <div class="vendor-header-left">
          <h1 class="vendor-page-title">My Jewellery Catalog</h1>
        </div>
        <div class="vendor-header-right">
          <a href="add-product.html" class="btn btn-primary btn-sm">
            + Add New Product
          </a>
        </div>
      </header>

      <div style="padding: var(--space-6);">
        <!-- Filters Bar -->
        <div style="background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); margin-bottom: var(--space-6); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-4);">
          <div style="display: flex; gap: var(--space-2);">
            <button class="btn btn-primary btn-sm" onclick="filterTable('all')">All Products</button>
            <button class="btn btn-secondary btn-sm" onclick="filterTable('Rings')">Rings</button>
            <button class="btn btn-secondary btn-sm" onclick="filterTable('Necklaces')">Necklaces</button>
            <button class="btn btn-secondary btn-sm" onclick="filterTable('Earrings')">Earrings</button>
          </div>
          <input type="text" id="product-search" placeholder="Search by title, SKU, or HUID..." onkeyup="searchProducts()" style="padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: var(--text-xs); min-width: 250px;">
        </div>

        <!-- Products Table -->
        <div style="background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-sm);">
          <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: var(--text-sm); text-align: left;">
              <thead>
                <tr style="border-bottom: 2px solid var(--border-subtle); color: var(--text-muted); font-size: var(--text-xs); text-transform: uppercase;">
                  <th style="padding: 12px 8px;">Product</th>
                  <th style="padding: 12px 8px;">Category</th>
                  <th style="padding: 12px 8px;">Gold & Weight</th>
                  <th style="padding: 12px 8px;">HUID Hallmark</th>
                  <th style="padding: 12px 8px;">Stock</th>
                  <th style="padding: 12px 8px;">Price</th>
                  <th style="padding: 12px 8px;">Status</th>
                  <th style="padding: 12px 8px;">Actions</th>
                </tr>
              </thead>
              <tbody id="vendor-products-body">
                <!-- Dynamically loaded -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script>
    let allListedProducts = [];

    document.addEventListener('DOMContentLoaded', function() {
      loadProducts();
    });

    function loadProducts() {
      // Default products from data.js (belonging to Raj Jewellers)
      const defaultProds = (window.products || []).filter(p => p.vendorName === 'Raj Jewellers');
      // Custom products published via add-product.html
      const customProds = JSON.parse(localStorage.getItem('swarnaveda_custom_products') || '[]');
      
      allListedProducts = [...customProds, ...defaultProds];
      renderTable(allListedProducts);
    }

    function renderTable(items) {
      const tbody = document.getElementById('vendor-products-body');
      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 40px; color: var(--text-muted);">No jewellery products found.</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(p => `
        <tr style="border-bottom: 1px solid var(--border-subtle);">
          <td style="padding: 12px 8px;">
            <div style="display: flex; align-items: center; gap: var(--space-3);">
              <img src="${p.image || '../assets/images/ring.jpg'}" class="product-thumb-sm" alt="${p.name}">
              <div>
                <div style="font-weight: 600; color: var(--charcoal); font-size: var(--text-xs);">${p.name}</div>
                <div style="font-size: 11px; color: var(--text-muted);">SKU: ${p.sku || p.id}</div>
              </div>
            </div>
          </td>
          <td style="padding: 12px 8px; font-size: var(--text-xs);">${p.category}</td>
          <td style="padding: 12px 8px; font-size: var(--text-xs);">
            <strong>${p.goldPurity || '22K'}</strong><br>
            <span style="color: var(--text-muted);">${p.netGoldWeight || '4.5'}g Gold</span>
          </td>
          <td style="padding: 12px 8px; font-size: var(--text-xs);">
            <span style="font-family: monospace; background: var(--surface-warm); padding: 2px 6px; border-radius: 4px;">${p.huid || 'AA2B3C4D'}</span>
          </td>
          <td style="padding: 12px 8px; font-size: var(--text-xs);">
            ${p.stock > 0 ? `<span style="color: var(--forest-green); font-weight: 600;">${p.stock} units</span>` : `<span style="color: var(--crimson); font-weight: 600;">Out of Stock</span>`}
          </td>
          <td style="padding: 12px 8px; font-weight: 700; font-size: var(--text-xs);">
            ₹${(p.price || 48950).toLocaleString('en-IN')}
          </td>
          <td style="padding: 12px 8px;">
            <span style="background: #e6f4ea; color: #137333; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;">Active</span>
          </td>
          <td style="padding: 12px 8px;">
            <div style="display: flex; gap: 6px;">
              <a href="../pages/product.html?id=${p.id}" class="btn btn-secondary btn-sm" target="_blank" style="padding: 4px 8px; font-size: 11px;">View</a>
              <button class="btn btn-secondary btn-sm" onclick="deleteProduct('${p.id}')" style="padding: 4px 8px; font-size: 11px; color: var(--crimson);">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function searchProducts() {
      const q = document.getElementById('product-search').value.toLowerCase();
      const filtered = allListedProducts.filter(p => 
        p.name.toLowerCase().includes(q) || 
        (p.sku && p.sku.toLowerCase().includes(q)) ||
        (p.huid && p.huid.toLowerCase().includes(q))
      );
      renderTable(filtered);
    }

    function filterTable(cat) {
      if (cat === 'all') {
        renderTable(allListedProducts);
      } else {
        renderTable(allListedProducts.filter(p => p.category === cat));
      }
    }

    function deleteProduct(id) {
      if (confirm('Are you sure you want to remove this jewellery item from the marketplace?')) {
        let customProds = JSON.parse(localStorage.getItem('swarnaveda_custom_products') || '[]');
        customProds = customProds.filter(p => p.id !== id);
        localStorage.setItem('swarnaveda_custom_products', JSON.stringify(customProds));
        loadProducts();
      }
    }
  </script>
</body>
</html>
